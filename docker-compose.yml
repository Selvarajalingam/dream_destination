services:
  postgres:
    build:
      context: ./db/docker
    image: dream-destination/postgis-pgvector:16-3.4
    container_name: dream_postgres
    environment:
      POSTGRES_USER: dream
      POSTGRES_PASSWORD: dream
      POSTGRES_DB: dream_destination
    ports:
      - '5433:5432'
    volumes:
      - dream_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dream -d dream_destination']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: dream_redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dream_pgdata:
